# Integració contínua: comprova cada canvi (lint, compilació i proves).
# No publica res: el desplegament es fa a part (vegeu docs/DESPLIEGUE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # escriptori: la web sense comptes; comptes: una còpia amb Supabase contra un Supabase simulat
      - run: npx playwright test --project=escriptori --project=comptes
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  # La migració de la base de dades en un Postgres net: RLS, privilegis i funcions.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/test-db.sh
